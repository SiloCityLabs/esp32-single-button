name: ESPHome C6 Compatibility

on:
  schedule:
    # Weekly on Thursday at 11:00 UTC (6 AM EST / 7 AM EDT)
    - cron: '0 11 * * 4'
  workflow_dispatch:
  push:
    paths:
      - 'esphome-c6.yaml'
      - 'esphome-common.yaml'
      - '.github/workflows/esphome-compatibility.yml'
  pull_request:
    paths:
      - 'esphome-c6.yaml'
      - 'esphome-common.yaml'
      - '.github/workflows/esphome-compatibility.yml'

permissions:
  contents: read

jobs:
  compatibility:
    name: ESP32-C6 / stable
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull stable ESPHome image
        run: docker pull ghcr.io/esphome/esphome:stable

      - name: Show ESPHome version
        run: |
          docker run --rm --entrypoint esphome \
            ghcr.io/esphome/esphome:stable version

      - name: Validate C6 configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/config" \
            ghcr.io/esphome/esphome:stable \
            config esphome-c6.yaml

      - name: Compile C6 firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/config" \
            ghcr.io/esphome/esphome:stable \
            compile esphome-c6.yaml
